# Daily active app limits, in minutes.
# Format:
# [Application name]: minutes
# [Application 1, Application 2]: shared group limit in minutes
# [*]: global daily active-time limit for all apps
#
# Application names must match names from activity_report.sh.
# EXCLUDE_APPS are never closed by limits or sleep time.
# SLEEP_START/SLEEP_END define a curfew window by hour, e.g. 21 to 10.
# WARNING_BEFORE_SEC defines when to show a limit warning.

EXCLUDE_APPS=Finder,System Settings,Terminal,Activity Monitor
SLEEP_START=21
SLEEP_END=10
WARNING_BEFORE_SEC=300

[Roblox]: 0
[Chrome, Safari]: 60
[Claude]: 0
[*]: 60
